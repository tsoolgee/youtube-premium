<script>
// דמה של יוטיוב: מחליף את ה-API של הנגן ואת נתיב ה-player בקבצים המקומיים.
// פרמטרים: ?lang=en (ממשק אנגלי), ?dark=1 (html[dark]), ?label=1 (כפתור "הורדה" עם טקסט), ?msgs=0 (בלי yt.msgs_)
const Q = new URLSearchParams(location.search);
window.__Q = Object.fromEntries(Q);
if (Q.get('lang') === 'en') document.documentElement.lang = 'en-US';
if (Q.get('dark') === '1') document.documentElement.setAttribute('dark', '');
// המחרוזות האמיתיות מ-yt.msgs_ (נקראו מהדף האמיתי 16/09/2026)
if (Q.get('msgs') !== '0') window.yt = { msgs_: Q.get('lang') === 'en'
  ? { DOWNLOADING: 'Downloading', DOWNLOADED: 'Downloaded', KEEP_OPEN: 'Keep this window open to continue', VIEW_DOWNLOADS: 'View',
      DOWNLOAD_QUALITY: 'Download Quality', REMEMBER_MY_SETTINGS: 'Remember my settings', SBOX_INAPPROPRIATE_CANCEL: 'Cancel', DOWNLOAD: 'Download',
      CANCEL: 'Cancel', DELETE: 'Delete', DELETE_FROM_DOWNLOADS: 'Remove from downloads', RETRY: 'Retry', DOWNLOADS: 'Downloads', YOUR_DOWNLOADS: 'Your downloads',
      VIDEOS_DOWNLOADING_RATIO: 'Downloading... $downloaded/$total' }
  : { DELETE_FROM_DOWNLOADS: 'הסרה מההורדות', DOWNLOAD: 'הורדה', DOWNLOADED: 'הורדת', DOWNLOADING: 'יורד', DOWNLOAD_AGAIN: 'הורדה חוזרת',
      DOWNLOAD_QUALITY: 'איכות ההורדה', DOWNLOAD_UNAVAILABLE: 'ההורדה לא זמינה. צריך לנסות סרטון אחר.', KEEP_OPEN: 'יש להשאיר את החלון פתוח כדי להמשיך',
      PREPARING_TO_DOWNLOAD: 'הכנות אחרונות להורדה...', REMEMBER_MY_SETTINGS: 'שמירת ההגדרות שלי', SBOX_INAPPROPRIATE_CANCEL: 'ביטול', VIEW_DOWNLOADS: 'לצפייה בסרטון',
      CANCEL: 'ביטול', DELETE: 'מחיקה', RETRY: 'ניסיון חוזר', DOWNLOADS: 'הורדות', YOUR_DOWNLOADS: 'ההורדות שלך', NO_DOWNLOADS: 'אין הורדות',
      VIDEOS_DOWNLOADING_RATIO: 'ההורדה מתבצעת... $total/$downloaded', WAITING_TO_DOWNLOAD: 'בהמתנה להורדה...' } };
history.replaceState(null, '', '/test/index.html?v=jNQXAC9IVRw');
const realFetch = window.fetch;

window.fetch = async (url, opts) => {
  if (String(url).includes('/youtubei/v1/player')) {
    window.__playerRequest = JSON.parse(opts.body);
    if (window.__failPlayer) return new Response('blocked', { status: 418 });
    const f = (itag, mime, len, extra) => ({ itag, url: location.origin + '/test/' + (mime.startsWith('audio') ? 'a.m4a' : 'v.mp4') + (window.__brokenStreams ? '-missing' : '') + '?x=1', mimeType: mime, contentLength: String(len), bitrate: itag, ...extra });
    return new Response(JSON.stringify({
      playabilityStatus: { status: 'OK' },
      adPlacements: [1], playerAds: [1],
      videoDetails: { title: 'Me at the zoo: test/1', lengthSeconds: '19' },
      streamingData: { adaptiveFormats: [
        // איכויות נוספות (מצביעות לאותו קובץ 240p) – כדי לבדוק את רשימת כל האפשרויות בדיאלוג
        f(137, 'video/mp4; codecs="avc1.640028"', 3223790, { height: 1080, fps: 60, qualityLabel: '1080p60' }),
        f(136, 'video/mp4; codecs="avc1.4d401f"', 1611895, { height: 720, fps: 30, qualityLabel: '720p' }),
        f(135, 'video/mp4; codecs="avc1.4d401e"', 805947, { height: 480, fps: 30, qualityLabel: '480p' }),
        f(134, 'video/mp4; codecs="avc1.4d400c"', 322379, { height: 240, qualityLabel: '240p' }),
        f(395, 'video/mp4; codecs="av01.0.00M.08"', 322379, { height: 240, qualityLabel: '240p' }),
        f(140, 'audio/mp4; codecs="mp4a.40.2"', 309288, {}),
        f(139, 'audio/mp4; codecs="mp4a.40.5"', 309288, { isDrc: true, bitrate: 999 }),
      ] },
    }), { headers: { 'content-type': 'application/json' } });
  }
  return realFetch(url, opts);
};
const attach = Element.prototype.attachShadow; Element.prototype.attachShadow = function (o) { return attach.call(this, { ...o, mode: 'open' }); };
HTMLAnchorElement.prototype.click = function () { window.__saved = { name: this.download, href: this.href }; };
window.open = (u) => { window.__opened = u; return null; };
</script>

<script>
// "הנגן של יוטיוב": API ציבורי עד 2, והממשק מצייר את המהירות שלו אחרי כל שינוי
(() => {
  const mp = document.getElementById('movie_player');
  const vid = mp.querySelector('video');
  const RATES = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
  let rate = 1;
  window.__upsell = 0;
  const render = () => {
    mp.querySelector('.ytp-variable-speed-panel-display span').textContent = rate.toFixed(2) + 'x';
    const sl = mp.querySelector('.ytp-varispeed-input-slider');
    sl.value = rate;
    sl.setAttribute('aria-valuenow', rate);
    document.querySelector('#speed-item .ytp-menuitem-content').textContent = rate === 1 ? 'רגילה' : String(rate);
  };
  // כמו הנגן האמיתי: setPlaybackRate פועל רק כשהמהירות "שלו" משתנה
  const set = r => { const n = Math.min(2, Math.max(0.25, Math.round(r * 20) / 20)); if (n === rate) return; rate = n; vid.playbackRate = rate; render(); };
  mp.getAvailablePlaybackRates = () => RATES.slice();
  mp.setPlaybackRate = r => set(+r);
  mp.getPlaybackRate = () => rate;
  mp.getVideoData = () => ({ video_id: 'jNQXAC9IVRw', title: 'Me at the zoo: test/1' });
  const sl = mp.querySelector('.ytp-varispeed-input-slider');
  sl.addEventListener('input', () => set(+sl.value));
  for (const b of mp.querySelectorAll('.ytp-variable-speed-panel-increment-button')) {
    b.addEventListener('click', () => set(rate + (b.textContent.trim() === '+' ? 0.05 : -0.05)));
  }
  for (const b of mp.querySelectorAll('.ytp-variable-speed-panel-preset-button')) {
    b.addEventListener('click', () => { const r = +b.textContent.match(/[\d.]+/)[0]; if (r > 2) window.__upsell++; else set(r); });
  }
})();
</script>

<script>
// ?label=1: כפתור רחב עם הטקסט "הורדה" (ytSpecButtonShapeNextButtonTextContent)
if (window.__Q.label === '1') {
  const b = document.getElementById('official-dl');
  b.classList.remove('ytSpecButtonShapeNextIconButton');
  const t = document.createElement('div');
  t.className = 'ytSpecButtonShapeNextButtonTextContent';
  t.textContent = document.documentElement.lang.startsWith('en') ? 'Download' : 'הורדה';
  b.append(t);
  b.style.padding = '0 16px 0 12px';
}
// הטיפול של "יוטיוב" עצמו – אסור שירוץ כשההשתלטות פעילה
window.__pageClicks = [];
for (const id of ['official-dl', 'item-dl', 'item-save', 'menu-btn']) {
  document.getElementById(id).addEventListener('click', () => window.__pageClicks.push(id));
}
document.getElementById('dropdown').close = function () { this.__closed = true; };
</script>

<script>
(() => {
  const host = document.querySelector('variable-speed-controller-view-model');
  const sl = host.querySelector('input'), disp = host.querySelector('.ytwVariableSpeedControllerViewModelPlaybackSpeedDisplay');
  const mp = document.getElementById('movie_player');
  const show = r => { disp.textContent = r.toFixed(2) + 'x'; };
  sl.addEventListener('input', () => { mp.setPlaybackRate(+sl.value); show(+sl.value); });
  const [minus, plus] = host.querySelectorAll('.ytSliderShapeHostIncrementButton');
  minus.addEventListener('click', () => { const r = Math.max(0.25, +sl.value - 0.05); sl.value = r; mp.setPlaybackRate(r); show(r); });
  plus.addEventListener('click', () => { const r = Math.min(2, +sl.value + 0.05); sl.value = r; mp.setPlaybackRate(r); show(r); });
  for (const b of host.querySelectorAll('ytw-variable-speed-controller-speed-button-view-model button')) {
    b.addEventListener('click', () => { const r = parseFloat(b.textContent); sl.value = r; mp.setPlaybackRate(r); show(r); });
  }
})();
// "יוטיוב" מציג אזהרת חוסם פרסומות (לבדיקה: __showEnforcement())
window.__showEnforcement = () => {
  const pc = document.querySelector('ytd-popup-container');
  const d = document.createElement('tp-yt-paper-dialog');
  d.setAttribute('opened', '');
  d.style.cssText = 'display:block;position:fixed;top:30%;left:30%;background:#fff;color:#000;padding:30px';
  const ev = document.createElement('ytd-enforcement-message-view-model');
  ev.textContent = 'Ad blockers are not allowed';
  d.append(ev);
  pc.append(d);
  const bd = document.createElement('tp-yt-iron-overlay-backdrop');
  bd.setAttribute('opened', '');
  bd.style.cssText = 'display:block;position:fixed;inset:0;background:rgba(0,0,0,.6)';
  document.body.append(bd);
  return d;
};
</script>
